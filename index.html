<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Linda App</title>
    <!-- Script WAJIB Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-bg: #f8fafc;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #6366f1, #4f46e5);
            --tabungan-gradient: linear-gradient(135deg, #10b981, #059669);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --input-bg: #334155;
                --border-color: #475569;
                --primary: #818cf8;
                --primary-gradient: linear-gradient(135deg, #6366f1, #4f46e5);
                --tabungan-gradient: linear-gradient(135deg, #10b981, #059669);
                --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Card Saldo */
        .saldo-box {
            background: var(--primary-gradient);
            color: #ffffff;
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 14px;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.2);
            position: relative;
            overflow: hidden;
        }

        .saldo-box h4 {
            margin: 0 0 6px 0;
            font-size: 11px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .saldo-box p {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Card Target Tabungan */
        .target-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 22px;
        }

        .target-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .target-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .target-badge {
            background: var(--primary);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .target-amounts {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .target-amounts strong {
            color: var(--text-main);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--tabungan-gradient);
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* Custom Input Nominal */
        .input-group {
            position: relative;
        }

        .input-prefix {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group input {
            padding-left: 42px;
        }

        /* Tombol Kirim */
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            margin-top: 10px;
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.25);
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Linda App</h2>
            <p>Catatan Keuangan & Tabungan</p>
        </div>

        <!-- Card Saldo Belanja -->
        <div class="saldo-box">
            <h4>Saldo Utama</h4>
            <p id="totalSaldo">Memuat saldo...</p>
        </div>

        <!-- Card Target Tabungan -->
        <div class="target-box">
            <div class="target-header">
                <span class="target-title" id="namaTarget">Target Tabungan</span>
                <span class="target-badge" id="persenTarget">0%</span>
            </div>
            <div class="target-amounts">
                <span>Terkumpul: <strong id="totalTabungan">Rp 0</strong></span>
                <span id="targetNominal">/ Rp 0</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressFill" class="progress-bar-fill"></div>
            </div>
        </div>
        
        <div class="form-group">
            <label>Keterangan Transaksi</label>
            <input type="text" id="aktivitas" placeholder="Cth: Beli Makan Siang / Setor Tabungan">
        </div>

        <div class="form-group">
            <label>Jenis Transaksi</label>
            <select id="jenis">
                <option value="Pengeluaran">Pengeluaran</option>
                <option value="Pemasukan">Pemasukan</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select id="kategori">
                <option value="Makanan">Makanan & Minuman</option>
                <option value="Makanan Dan Lainnya">Kebutuhan Harian</option>
                <option value="Lainnya">Lain-lain</option>
                <option value="Tabungan/Investasi">Tabungan / Investasi</option>
                <option value="Gaji/Uang Masuk">Pendapatan / Gaji</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nominal</label>
            <div class="input-group">
                <span class="input-prefix">Rp</span>
                <input type="number" id="jumlah" placeholder="0" inputmode="numeric">
            </div>
        </div>

        <div class="form-group">
            <label>Metode Pembayaran</label>
            <select id="metode">
                <option value="Cash">Tunai (Cash)</option>
                <option value="Transfer">Transfer / QRIS</option>
            </select>
        </div>
        
        <button type="button" onclick="kirimData()">Simpan Transaksi</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let urlWebApp = "https://script.google.com/macros/s/AKfycbyEyj9QZc8IMvRXZGnMgxw-dqk0Czqnxu52R2naO1Vv-VBZEJUWOloT4tMunD7a-BeM/exec";

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { 
                style: 'currency', 
                currency: 'IDR', 
                maximumFractionDigits: 0 
            }).format(number);
        }

        function muatSaldo() {
            document.getElementById("totalSaldo").innerText = "Memuat saldo...";
            
            fetch(urlWebApp, {
                method: "GET",
                redirect: "follow"
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById("totalSaldo").innerText = formatRupiah(data.sisaSaldo);

                    let totalTabungan = data.totalTabungan || 0;
                    let targetTabungan = data.targetTabungan || 0;
                    let namaTarget = data.namaTarget || "Target Tabungan";

                    document.getElementById("namaTarget").innerText = namaTarget;
                    document.getElementById("totalTabungan").innerText = formatRupiah(totalTabungan);
                    document.getElementById("targetNominal").innerText = "/ " + formatRupiah(targetTabungan);

                    let persen = targetTabungan > 0 ? Math.min(100, Math.round((totalTabungan / targetTabungan) * 100)) : 0;
                    document.getElementById("persenTarget").innerText = persen + "%";
                    document.getElementById("progressFill").style.width = persen + "%";

                } else {
                    document.getElementById("totalSaldo").innerText = "Gagal memuat";
                }
            })
            .catch(error => {
                console.error("Error load saldo:", error);
                document.getElementById("totalSaldo").innerText = "Gagal terhubung";
            });
        }

        muatSaldo();

        function kirimData() {
            let aktivitas = document.getElementById("aktivitas").value.trim();
            let jenis = document.getElementById("jenis").value;
            let kategori = document.getElementById("kategori").value;
            let jumlah = document.getElementById("jumlah").value.trim();
            let metode = document.getElementById("metode").value;

            if (!aktivitas || !jumlah) {
                tg.showAlert("Harap isi keterangan dan nominal transaksi dengan lengkap.");
                return;
            }

            let btn = document.querySelector("button");
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            fetch(urlWebApp, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    aktivitas: aktivitas,
                    jenis: jenis,
                    kategori: kategori,
                    jumlah: Number(jumlah),
                    metode: metode
                })
            })
            .then(response => response.json())
            .then(res => {
                if (res.status === "success") {
                    tg.showAlert("Transaksi berhasil disimpan.");
                    document.getElementById("aktivitas").value = "";
                    document.getElementById("jumlah").value = "";
                    muatSaldo();
                } else {
                    tg.showAlert("Gagal: " + res.message);
                }
            })
            .catch(error => {
                console.error("Error:", error);
                tg.showAlert("Terjadi kesalahan sistem, silakan coba lagi.");
            })
            .finally(() => {
                btn.innerText = "Simpan Transaksi";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
