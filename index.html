<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linda - Catat Jajan Sayangku</title>
    <!-- Script WAJIB buat Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f9);
            color: var(--tg-theme-text-color, #333);
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #ff6b81; }
        .form-group { margin-bottom: 15px; }
        input, select {
            width: 100%; padding: 10px; border-radius: 6px;
            border: 1px solid #ccc; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px;
            background-color: var(--tg-theme-button-color, #ff4757);
            color: var(--tg-theme-button-text-color, #fff);
            border: none; border-radius: 6px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Catat Jajan Dulu Beb! 💸</h2>
        
        <div class="form-group">
            <label>Beli Apa Tadi?</label>
            <input type="text" id="aktivitas" placeholder="Cth: Ayam Geprek">
        </div>
        <div class="form-group">
            <label>Habis Berapa? (Rp)</label>
            <input type="number" id="jumlah" placeholder="Cth: 15000">
        </div>
        
        <button onclick="kirimData()">Lapor ke Linda! 😘</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        function kirimData() {
            let aktivitas = document.getElementById("aktivitas").value;
            let jumlah = document.getElementById("jumlah").value;

            if (!aktivitas || !jumlah) {
                tg.showAlert("Isi yang lengkap dong sayang! 😤");
                return;
            }

            let data = JSON.stringify({ aktivitas: aktivitas, jumlah: jumlah });
            tg.sendData(data); // Kirim balik ke script Python Bot kamu
        }
    </script>
</body>
</html>
