<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linda - Catat Jajan Sayangku</title>
    <!-- Script WAJIB buat Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f9);
            color: var(--tg-theme-text-color, #333);
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #ff6b81; margin-top: 0; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%; padding: 10px; border-radius: 6px;
            border: 1px solid #ccc; box-sizing: border-box; font-size: 14px;
        }
        button {
            width: 100%; padding: 12px;
            background-color: var(--tg-theme-button-color, #ff4757);
            color: var(--tg-theme-button-text-color, #fff);
            border: none; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 16px; margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Catat Jajan Dulu Beb! 💸</h2>
        
        <div class="form-group">
            <label>Aktivitas (Beli Apa Tadi?)</label>
            <input type="text" id="aktivitas" placeholder="Cth: Ayam Geprek + Es Teh">
        </div>

        <div class="form-group">
            <label>Jenis Transaksi</label>
            <select id="jenis">
                <option value="Pengeluaran">Pengeluaran 🔴</option>
                <option value="Pemasukan">Pemasukan 🟢</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select id="kategori">
                <option value="Makanan">Makanan</option>
                <option value="Makanan Dan Lainnya">Makanan Dan Lainnya</option>
                <option value="Lainnya">Lainnya (Rokok/Kopi/Dll)</option>
                <option value="Tabungan/Investasi">Tabungan/Investasi</option>
                <option value="Gaji/Uang Masuk">Gaji/Uang Masuk</option>
            </select>
        </div>

        <div class="form-group">
            <label>Jumlah (Rp)</label>
            <input type="number" id="jumlah" placeholder="Cth: 15000">
        </div>

        <div class="form-group">
            <label>Metode Pembayaran</label>
            <select id="metode">
                <option value="Cash">Cash 💵</option>
                <option value="Transfer">Transfer 💳</option>
            </select>
        </div>
        
        <button type="button" onclick="kirimData()">Lapor ke Linda! 😘</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Bikin web app-nya full screen di Telegram

        function kirimData() {
            let aktivitas = document.getElementById("aktivitas").value.trim();
            let jenis = document.getElementById("jenis").value;
            let kategori = document.getElementById("kategori").value;
            let jumlah = document.getElementById("jumlah").value.trim();
            let metode = document.getElementById("metode").value;

            if (!aktivitas || !jumlah) {
                tg.showAlert("Isi aktivitas sama jumlahnya yang lengkap dong sayang! 😤");
                return;
            }

            // Alamat Web App URL Google Script kamu yang udah kita deploy
            let urlWebApp = "https://script.google.com/macros/s/AKfycbyBuKfyWeFUDeJRAgNILbyoa6woY37oE_dkFFyk1fiWBXKtqt3DEzmlUzRu_Rko8MVA/exec";

            let dataPayload = {
                aktivitas: aktivitas,
                jenis: jenis,
                kategori: kategori,
                jumlah: Number(jumlah),
                metode: metode
            };

            let btn = document.querySelector("button");
            btn.innerText = "Lagi dicatet ya beb... ⏳";
            btn.disabled = true;

            // Kirim pakai fetch ke Google Apps Script
            fetch(urlWebApp, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dataPayload)
            })
            .then(response => {
                tg.showAlert("Yeay! Berhasil dicatat sama Linda! 😘✨");
                tg.close(); // Otomatis nutup web app-nya setelah sukses!
            })
            .catch(error => {
                console.error("Error:", error);
                tg.showAlert("Duh error sayang, coba lagi ya! 😩");
                btn.innerText = "Lapor ke Linda! 😘";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
