<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linda - Catat Jajan Sayangku</title>
    <!-- Script WAJIB buat Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #fff;
            --text-color: #333;
            --input-bg: #fff;
            --border-color: #ccc;
            --btn-bg: #ff4757;
            --btn-text: #fff;
        }

        /* Mode Malam / Dark Mode Otomatis ngikutin Telegram */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #18191a;
                --card-bg: #242526;
                --text-color: #e4e6eb;
                --input-bg: #3a3b3c;
                --border-color: #393a3b;
                --btn-bg: #ff6b81;
                --btn-text: #fff;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        h2 { text-align: center; color: #ff6b81; margin-top: 0; font-size: 22px; }
        
        /* Kotak Info Saldo Realtime */
        .saldo-box {
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        }
        .saldo-box h4 { margin: 0 0 5px 0; font-size: 13px; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.5px; }
        .saldo-box p { margin: 0; font-size: 20px; font-weight: bold; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box; font-size: 14px;
            outline: none; transition: border 0.2s;
        }
        input:focus, select:focus {
            border-color: #ff6b81;
        }
        button {
            width: 100%; padding: 14px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 16px; margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Catat Jajan Dulu Beb! 💸</h2>

        <!-- Tampilan Total Saldo Realtime -->
        <div class="saldo-box">
            <h4>Sisa Uang Belanja Kamu</h4>
            <p id="totalSaldo">Memuat saldo...</p>
        </div>
        
        <div class="form-group">
            <label>Aktivitas (Beli Apa Tadi?)</label>
            <input type="text" id="aktivitas" placeholder="Cth: Ayam Geprek + Es Teh">
        </div>

        <div class="form-group">
            <label>Jenis Transaksi</label>
            <select id="jenis">
                <option value="Pengeluaran">Pengeluaran 🔴</option>
                <option value="Pemasukan">Pemasukan 🟢</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select id="kategori">
                <option value="Makanan">Makanan</option>
                <option value="Makanan Dan Lainnya">Makanan Dan Lainnya</option>
                <option value="Lainnya">Lainnya (Rokok/Kopi/Dll)</option>
                <option value="Tabungan/Investasi">Tabungan/Investasi</option>
                <option value="Gaji/Uang Masuk">Gaji/Uang Masuk</option>
            </select>
        </div>

        <div class="form-group">
            <label>Jumlah (Rp)</label>
            <input type="number" id="jumlah" placeholder="Cth: 15000">
        </div>

        <div class="form-group">
            <label>Metode Pembayaran</label>
            <select id="metode">
                <option value="Cash">Cash 💵</option>
                <option value="Transfer">Transfer 💳</option>
            </select>
        </div>
        
        <button type="button" onclick="kirimData()">Lapor ke Linda! 😘</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let urlWebApp = "https://script.google.com/macros/s/AKfycbyBuKfyWeFUDeJRAgNILbyoa6woY37oE_dkFFyk1fiWBXKtqt3DEzmlUzRu_Rko8MVA/exec";

        // Ambil data saldo realtime saat halaman pertama kali dibuka
        function muatSaldo() {
            fetch(urlWebApp)
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    let formattedSaldo = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(data.sisaSaldo);
                    document.getElementById("totalSaldo").innerText = formattedSaldo;
                } else {
                    document.getElementById("totalSaldo").innerText = "Gagal memuat";
                }
            })
            .catch(error => {
                console.error("Error load saldo:", error);
                document.getElementById("totalSaldo").innerText = "Error";
            });
        }

        muatSaldo();

        function kirimData() {
            let aktivitas = document.getElementById("aktivitas").value.trim();
            let jenis = document.getElementById("jenis").value;
            let kategori = document.getElementById("kategori").value;
            let jumlah = document.getElementById("jumlah").value.trim();
            let metode = document.getElementById("metode").value;

            if (!aktivitas || !jumlah) {
                tg.showAlert("Isi aktivitas sama jumlahnya yang lengkap dong sayang! 😤");
                return;
            }

            let dataPayload = {
                aktivitas: aktivitas,
                jenis: jenis,
                kategori: kategori,
                jumlah: Number(jumlah),
                metode: metode
            };

            let btn = document.querySelector("button");
            btn.innerText = "Lagi dimasukin Linda ya beb... ⏳";
            btn.disabled = true;

            fetch(urlWebApp, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dataPayload)
            })
            .then(response => {
                tg.showAlert("Yey! Laporan sudah selesai Linda masukkan ke Spreadsheet ya, sayang! 😘✨");
                
                btn.innerText = "Lapor ke Linda! 😘";
                btn.disabled = false;
                
                document.getElementById("aktivitas").value = "";
                document.getElementById("jumlah").value = "";
                
                // Update otomatis saldonya setelah data masuk
                setTimeout(muatSaldo, 1500);
            })
            .catch(error => {
                console.error("Error:", error);
                tg.showAlert("Duh error sayang, coba lagi ya! 😩");
                btn.innerText = "Lapor ke Linda! 😘";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
