<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Linda - Catat Jajan Sayangku</title>
    <!-- Script WAJIB Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --input-bg: #f1f2f6;
            --border-color: #dfe4ea;
            --primary: #ff4757;
            --primary-gradient: linear-gradient(135deg, #ff6b81, #ff4757);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-main: #f5f6fa;
                --text-muted: #a4b0be;
                --input-bg: #2f3542;
                --border-color: #353b48;
                --primary: #ff6b81;
                --primary-gradient: linear-gradient(135deg, #ff6b81, #ee5253);
                --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Card Saldo */
        .saldo-box {
            background: var(--primary-gradient);
            color: #ffffff;
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 22px;
            box-shadow: 0 8px 16px rgba(255, 71, 87, 0.25);
            position: relative;
            overflow: hidden;
        }

        .saldo-box::before {
            content: "";
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(45deg);
            pointer-events: none;
        }

        .saldo-box h4 {
            margin: 0 0 6px 0;
            font-size: 11px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .saldo-box p {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 129, 0.15);
        }

        /* Custom Input Nominal */
        .input-group {
            position: relative;
        }

        .input-prefix {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group input {
            padding-left: 42px;
        }

        /* Tombol Kirim */
        button {
            width: 100%;
            padding: 15px;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            margin-top: 10px;
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.3);
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Catat Jajan Dulu Beb! 💸</h2>
            <p>Masukkan transaksi kamu dengan rapi ya</p>
        </div>

        <div class="saldo-box">
            <h4>Sisa Uang Belanja Kamu</h4>
            <p id="totalSaldo">Memuat saldo...</p>
        </div>
        
        <div class="form-group">
            <label>Aktivitas (Beli Apa Tadi?)</label>
            <input type="text" id="aktivitas" placeholder="Cth: Ayam Geprek + Es Teh">
        </div>

        <div class="form-group">
            <label>Jenis Transaksi</label>
            <select id="jenis">
                <option value="Pengeluaran">Pengeluaran 🔴</option>
                <option value="Pemasukan">Pemasukan 🟢</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select id="kategori">
                <option value="Makanan">Makanan 🍔</option>
                <option value="Makanan Dan Lainnya">Makanan Dan Lainnya 🍲</option>
                <option value="Lainnya">Lainnya (Rokok/Kopi/Dll) ☕</option>
                <option value="Tabungan/Investasi">Tabungan/Investasi 💰</option>
                <option value="Gaji/Uang Masuk">Gaji/Uang Masuk 💵</option>
            </select>
        </div>

        <div class="form-group">
            <label>Jumlah</label>
            <div class="input-group">
                <span class="input-prefix">Rp</span>
                <input type="number" id="jumlah" placeholder="0" inputmode="numeric">
            </div>
        </div>

        <div class="form-group">
            <label>Metode Pembayaran</label>
            <select id="metode">
                <option value="Cash">Cash 💵</option>
                <option value="Transfer">Transfer 💳</option>
            </select>
        </div>
        
        <button type="button" onclick="kirimData()">Lapor ke Linda! 😘</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let urlWebApp = "https://script.google.com/macros/s/AKfycbyBuKfyWeFUDeJRAgNILbyoa6woY37oE_dkFFyk1fiWBXKtqt3DEzmlUzRu_Rko8MVA/exec";

        function muatSaldo() {
            document.getElementById("totalSaldo").innerText = "Memuat saldo...";
            
            fetch(urlWebApp, {
                method: "GET",
                redirect: "follow"
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    let formattedSaldo = new Intl.NumberFormat('id-ID', { 
                        style: 'currency', 
                        currency: 'IDR', 
                        maximumFractionDigits: 0 
                    }).format(data.sisaSaldo);
                    document.getElementById("totalSaldo").innerText = formattedSaldo;
                } else {
                    document.getElementById("totalSaldo").innerText = "Gagal memuat";
                }
            })
            .catch(error => {
                console.error("Error load saldo:", error);
                document.getElementById("totalSaldo").innerText = "Gagal terhubung";
            });
        }

        muatSaldo();

        function kirimData() {
            let aktivitas = document.getElementById("aktivitas").value.trim();
            let jenis = document.getElementById("jenis").value;
            let kategori = document.getElementById("kategori").value;
            let jumlah = document.getElementById("jumlah").value.trim();
            let metode = document.getElementById("metode").value;

            if (!aktivitas || !jumlah) {
                tg.showAlert("Isi aktivitas sama jumlahnya yang lengkap dong sayang! 😤");
                return;
            }

            let btn = document.querySelector("button");
            btn.innerText = "Lagi dimasukin Linda ya beb... ⏳";
            btn.disabled = true;

            fetch(urlWebApp, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    aktivitas: aktivitas,
                    jenis: jenis,
                    kategori: kategori,
                    jumlah: Number(jumlah),
                    metode: metode
                })
            })
            .then(response => response.json())
            .then(res => {
                if (res.status === "success") {
                    tg.showAlert("Yey! Laporan sudah selesai Linda masukkan ke Spreadsheet ya, sayang! 😘✨");
                    document.getElementById("aktivitas").value = "";
                    document.getElementById("jumlah").value = "";
                    muatSaldo();
                } else {
                    tg.showAlert("Gagal: " + res.message);
                }
            })
            .catch(error => {
                console.error("Error:", error);
                tg.showAlert("Duh error sayang, coba lagi ya! 😩");
            })
            .finally(() => {
                btn.innerText = "Lapor ke Linda! 😘";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
